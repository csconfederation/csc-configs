// CS2FOW server-side visibility culling (anti-wallhack).
// Combine is the rollout canary; the other modes carry `remove: [cs2fow]`
// in plugin-deploy's manifest.yaml and intentionally ship no cs2fow.cfg.
//
// The plugin execs THIS file at load and again on every OnLevelInit, and
// plugin-deploy overlays csc-configs on top of the plugin archive, so this
// file overrides the upstream-shipped cfg/cs2fow.cfg wholesale. Any setting
// omitted here falls back to the plugin's compiled-in default, NOT to
// upstream's cfg -- so keep every convar listed explicitly.
//
// Tuning bias, deliberately: fail open (reveal rather than hide) and stay
// conservative on server cost. These values are NOT upstream's defaults.


// Engine Compatibility
sv_enable_donttransmit 0     // Required by CS2FOW's paired send-list handling. Upstream ships this
                             // in its own cs2fow.cfg; it must stay here or overriding drops it. Default: 1


// Master Switch
cs2fow_enable 1              // Live kill switch; takes effect without a restart or map change. Default: 1


// Smoke Occlusion -- DISABLED PENDING UPSTREAM FIX
cs2fow_smoke_occlusion 0     // Off deliberately. With smoke active the LOS test switches to 32x32
                             // pixel-center sampling and returns "blocked" before reaching the
                             // sub-pixel capsule proof, so a sliver of a player clearing cover can be
                             // hidden. The degradation is global: one smoke anywhere on the map applies
                             // to every player pair for its full ~18s life. Also the single largest
                             // game-thread cost (~132 KB copied per smoke per tick). Default: 1
cs2fow_he_clear_radius_units 100  // Inert while smoke_occlusion is 0. Kept at default so re-enabling
                                  // smoke is a one-line change. Range 0-320. Default: 100
cs2fow_he_clear_seconds 2.5       // Inert while smoke_occlusion is 0. Range 0-10. Default: 2.5


// Teammate Filtering
cs2fow_filter_teammates 0    // Never filter teammates: it removes radar/nameplates and doubles the
                             // ghost surface onto your own team. Note the plugin auto-enables this
                             // when mp_teammates_are_enemies is 1, which gamemode_competitive_server.cfg
                             // and MatchZy/warmup.cfg both pin to 0. Keep all three aligned. Default: 0


// Exposure Margins -- biased toward revealing players
cs2fow_shoulder_base_units 128    // Pinned equal to max_shoulder_units below. Shoulder origins are extra
                                  // viewing points and a player is revealed if ANY origin sees them, so a
                                  // larger offset reveals MORE. Pinning base == max gives every player the
                                  // maximum margin regardless of ping, which removes the ping-scaled
                                  // advantage without shrinking anyone's margin. Range 0-256. Default: 48
cs2fow_shoulder_rtt_scale 0.4     // Inert while base == max (the result is clamped to [base, max]).
                                  // Left at default so lowering base alone restores ping scaling. Default: 0.4
cs2fow_max_shoulder_units 128     // Ceiling for the ping-scaled origins. Range 0-256. Default: 128
cs2fow_visibility_hold_ms 200     // Once revealed, keep a player revealed this long. Raised from 47.
                                  // Wins on both axes: more exposure, and a held pair skips its
                                  // visibility query entirely rather than re-testing. Range 0-1000. Default: 47


// Server Cost
cs2fow_update_interval_ms 1  // Capture every tick. A floor checked once per game frame, NOT a rate;
                             // CS2 servers run at 64 tick (sub-tick input sampling replaced the old
                             // 128-tick option), so a frame is 15.625ms and any value <= 15 behaves
                             // identically: capture every tick.
                             //
                             // Do NOT raise this to save CPU. CheckTransmit does not compute
                             // visibility -- it applies the worker's last published result verbatim
                             // (transmit.cpp:161). The 100ms staleness gate is a ceiling on how long a
                             // stale HIDE keeps being applied; below it a stale "blocked" verdict keeps
                             // a player hidden. Nothing reveals a player early. So the capture interval
                             // IS the worst-case time-to-reveal: at 16 an enemy who steps into the open
                             // can stay unsent for an extra tick. cs2fow_visibility_hold_ms does not
                             // cover this either -- it only extends visibility for players already
                             // visible (visibility_worker.cpp:410-414), never a blocked -> visible
                             // transition. Range 1-100. Default: 1
cs2fow_worker_threads 2      // Worker threads. Applies on map activation only, not immediately.
                             // Workers sleep rather than spin and cannot stall the game thread;
                             // when they fall behind, pairs fail open. Range 1-4. Default: 2


// Diagnostics -- both must stay 0 on live servers
cs2fow_debug 0               // Records withheld-entity evidence into a 256-entry ring buffer. Costs an
                             // snprintf plus a linear scan per withheld entity per recipient per tick
                             // (~500/tick at 5v5). Enable only for short live debugging. Default: 0
cs2fow_debug_los_player 0    // MUST stay 0. Any non-zero value triggers an out-of-bounds stack read in
                             // draw_los_debug (unsigned underflow, plugin.cpp:837 as of v0.3.1) and will
                             // segfault the server. Reported upstream. Default: 0

// End of Config
say "> CSC Combine Config Loaded | cs2fow.cfg | fc4c201 | 2026-07-28 <"
