name: Publish latest config release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-release.yml
      - VERSIONS.md

permissions:
  contents: write

jobs:
  publish:
    name: Tag, release, and promote latest config release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: metadata
        run: |
          set -euo pipefail

          release_tag="$(grep -m1 '^### s[0-9].* — ' VERSIONS.md | cut -d' ' -f2)"
          if [[ -z "$release_tag" ]]; then
            echo "No release entry found in VERSIONS.md" >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create release and promote live
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          remote_release_sha="$(
            git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" |
              awk 'NR == 1 { print $1 }'
          )"

          if [[ -n "$remote_release_sha" && "$remote_release_sha" != "$TARGET_SHA" ]]; then
            echo "$RELEASE_TAG already points to $remote_release_sha; no release action needed."
            exit 0
          fi

          if [[ -z "$remote_release_sha" ]]; then
            git tag -a "$RELEASE_TAG" -m "${RELEASE_TAG} config release" "$TARGET_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "${RELEASE_TAG} config release" \
              --verify-tag
          fi

          git tag -fa live -m "Promote $RELEASE_TAG to live" "${RELEASE_TAG}^{}"
          git push origin refs/tags/live --force
